<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5d3b8c">
    <title>Two Paths, One Adventure — Offline</title>
    <style>
        :root{font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#25202c;background:#f8f3ec}
        *{box-sizing:border-box}
        body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#eadcf4,transparent 42%),#f8f3ec}
        main{width:min(100%,620px);padding:50px;border:1px solid rgba(37,32,44,.12);border-radius:32px;background:rgba(255,250,244,.85);box-shadow:0 24px 70px rgba(58,35,70,.14);text-align:center}
        span{display:grid;width:72px;height:72px;margin:0 auto 24px;place-items:center;border-radius:24px;color:white;background:#6b438f;font:700 28px Georgia,serif}
        h1{font:500 clamp(2.3rem,8vw,4.3rem)/1 Georgia,serif;letter-spacing:-.04em}
        p{color:#726c78;line-height:1.7}
        button{min-height:52px;margin-top:15px;border:0;border-radius:15px;padding:0 22px;color:#fff;background:#6b438f;font-weight:800}
    </style>
</head>
<body>
    <main>
        <span>↗</span>
        <h1>This path needs a connection.</h1>
        <p>The welcome screen and saved app shell can open offline, but new choices need the server so they can be stored safely.</p>
        <button onclick="location.reload()">Try Again</button>
    </main>
</body>
</html>
